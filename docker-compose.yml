services:
  faralist-web:
    container_name: faralist-landing
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URI=${DATABASE_URI:-file:./payload.db}
    volumes:
      # نگهداری پایگاه‌داده اس‌کیوالایت برای ماندگاری اطلاعات بین دیپلوی‌ها
      - ./payload.db:/app/data/payload.db
      # نگهداری فایل‌های آپلود شده (مدیا) در سرور
      - ./public/uploads:/app/public/uploads

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  payload_data:
